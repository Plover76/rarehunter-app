name: App CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"   # или последняя стабильная

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test || echo "No tests yet"

      - name: Build debug APK
        run: flutter build apk --debug
